<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="vesperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E51937" />
      <stop offset="50%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#990B21" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C8102E" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="#1A1A1A" />
  
  <!-- Outer glowing ring accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#vesperGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Main Vesper "V" Stitch Icon Graphic -->
  <g filter="url(#shadow)">
    <!-- Left Wing of V -->
    <path d="M 120 120 L 220 120 L 256 340 L 190 340 Z" fill="url(#vesperGrad)" />
    <!-- Right Wing of V -->
    <path d="M 392 120 L 292 120 L 256 340 L 322 340 Z" fill="#E51937" opacity="0.95" />
    <!-- Center Needle & Thread Motif -->
    <path d="M 256 90 L 276 220 L 256 390 L 236 220 Z" fill="url(#goldGrad)" />
    <!-- Needle Eye -->
    <ellipse cx="256" cy="140" rx="6" ry="16" fill="#1A1A1A" />
    <!-- Thread loop -->
    <path d="M 256 124 C 230 70, 310 50, 370 90" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
